<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product</title>
    <link rel="stylesheet" href="general.css">
    <link rel="stylesheet" href="css/product.css">
</head>
<body>
<!-- Header & Navigation -->
    <header>
        <div class="logo">
            <a href="index.html">KIVO</a>
        </div>

        <input type="checkbox" id="toggler">
        
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="shop.html" class="active">Shop</a>
            <a href="collection.html">Collections</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>

        <div class="nav-actions">
            <!-- Wishlist / Heart Icon -->
            <a href="wishlist.html" class="icon-btn" aria-label="View Wishlist">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="#7A263A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
                <span class="badge" id="fav-count">0</span>
            </a>

            <!-- Shopping Bag Icon -->
            <button class="icon-btn" id="open-cart" aria-label="View Shopping Cart">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="#7A263A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <path d="M16 10a4 4 0 0 1-8 0"></path>
                </svg>
                <span class="badge" id="cart-count">0</span>
            </button>

            <!-- User Profile Icon -->
            <a href="profile.html" class="icon-btn" id="open-profile" aria-label="View User Profile">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" stroke="#7A263A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </a>
        </div>
        <label for="toggler" class="fas fa-bars" aria-label="Toggle navigation menu"></label>
    </header>

    <main class="product-page">
        <div onclick="goBack()" class="return-btn"><svg width="50px" height="50px" viewBox="0 0 1024 1024" class="icon" xmlns="http://www.w3.org/2000/svg"><path fill="#000000" d="M224 480h640a32 32 0 110 64H224a32 32 0 010-64z"/><path fill="#000000" d="M237.248 512l265.408 265.344a32 32 0 01-45.312 45.312l-288-288a32 32 0 010-45.312l288-288a32 32 0 1145.312 45.312L237.248 512z"/></svg></div>
        <div class="product-detail">
            <!-- Product Image -->
            <div class="product-detail-image">
                <img id="productImage" src="" alt="">
            </div>

            <!-- Product Information -->
            <div class="product-detail-info">
                <span class="product-detail-category" id="productCategory"></span>
                <h1 id="productTitle"></h1>
                <p class="product-detail-price" id="productPrice"></p>
                <p class="product-detail-description" id="productDescription"></p>
                <div class="product-actions">
                    <button class="quantity-btn" id="decreaseQty">
                        −
                    </button>
                    <span id="quantity">1</span>
                    <button class="quantity-btn" id="increaseQty">
                        +
                    </button>
                </div>
                <button class="add-to-cart-detail" id="addToCart">
                    Add to Cart
                </button>
            </div>
        </div>
    </main>

    <!-- =========================
        CART OVERLAY & DRAWER
    ========================== -->
    <div class="cart-overlay" id="cartOverlay"></div>
    <aside class="cart-drawer" id="cartDrawer" aria-hidden="true">
        <div class="cart-header">
            <div>
                <h2>Your Bag 🛍️</h2>
                <span id="cartItemLabel">0 items</span>
            </div>
            <button type="button" id="closeCart" class="cart-close" aria-label="Close shopping bag">&times;</button>
        </div>

        <!-- CART CONTENT -->
        <div class="cart-body" id="cartBody">

            <!-- Dynamic cart items rendered by cart.js will go here -->

            <!-- Empty State -->
            <div class="cart-empty" id="cartEmpty">
                <span class="empty-bag-icon">🛒</span>
                <h3>Your bag is empty</h3>
                <p>Looks like you haven't added anything to your cart yet.</p>
                <a href="shop.html" class="cart-shop-btn">
                    Continue Shopping ✨
                </a>
            </div>

        </div>

        <!-- CART FOOTER -->
        <div class="cart-footer" id="cartFooter">
            <div class="cart-subtotal">
                <span>Subtotal</span>
                <strong id="cartSubtotal">$0.00</strong>
            </div>

            <p class="cart-note">
                Shipping and taxes calculated at checkout. 🚚
            </p>

            <button type="button" class="checkout-btn" id="checkoutBtn">
                Proceed to Checkout
            </button>

            <button type="button" class="continue-shopping-btn" id="continueShopping">
                Continue Shopping
            </button>
        </div>
    </aside>
    <script src="js/products.js"></script>
    <script src="js/wishlist.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/productpage.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
